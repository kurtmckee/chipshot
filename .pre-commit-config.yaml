ci:
  autoupdate_schedule: "quarterly"

default_language_version:
  python: "python3.15"

repos:
  - repo: "meta"
    hooks:
      - id: "check-hooks-apply"
      - id: "check-useless-excludes"

  - repo: "https://github.com/pre-commit/pre-commit-hooks"
    rev: "3e8a8703264a2f4a69428a0aa4dcb512790b2c8c"  # frozen: v6.0.0
    hooks:
      - id: "check-added-large-files"
      - id: "check-merge-conflict"
      - id: "check-yaml"
      - id: "end-of-file-fixer"
      - id: "mixed-line-ending"
        args:
          - "--fix=lf"
      - id: "trailing-whitespace"

  - repo: "https://github.com/asottile/pyupgrade"
    rev: "75992aaa40730136014f34227e0135f63fc951b4"  # frozen: v3.21.2
    hooks:
      - id: "pyupgrade"
        name: "Enforce Python 3.11+ idioms"
        args: ["--py311-plus"]

  - repo: "https://github.com/psf/black-pre-commit-mirror"
    rev: "4160603246a6b365d4a2af661c6d71b0a0f50478"  # frozen: 26.5.1
    hooks:
      - id: "black"

  - repo: "https://github.com/pycqa/isort"
    rev: "9f905615631c545f5aea2516508109350d1d2f7d"  # frozen: 9.0.2
    hooks:
      - id: "isort"

  - repo: "https://github.com/pycqa/flake8"
    rev: "c48217e1fc006c2dddd14df54e83b67da15de5cd"  # frozen: 7.3.0
    hooks:
      - id: "flake8"
        additional_dependencies:
          - "flake8-toml-config==1.1.0"
          - "flake8-bugbear==26.9.30"

  - repo: "https://github.com/editorconfig-checker/editorconfig-checker"
    rev: "0adfdb012938ada0cf563a40f2fceaf9466290ca"  # frozen: v4.0.2
    hooks:
      - id: "editorconfig-checker"

  - repo: "https://github.com/python-jsonschema/check-jsonschema"
    rev: "12e63946db2c5cfcc9030fac21c3883ba88c6ed8"  # frozen: 0.38.0
    hooks:
      - id: "check-readthedocs"
      - id: "check-dependabot"
      - id: "check-github-workflows"

  - repo: "https://github.com/rhysd/actionlint"
    rev: "914e7df21a07ef503a81201c76d2b11c789d3fca"  # frozen: v1.7.12
    hooks:
      - id: "actionlint"
        additional_dependencies:
          - "github.com/wasilibs/go-shellcheck/cmd/shellcheck@4e7020840c303923eb1ab846fc446d77be892570"  # frozen: v0.11.1

  - repo: "https://github.com/kurtmckee/pre-commit-hooks"
    rev: "44b638c826f1acd2ba2c5995db3156be60c5efea"  # frozen: v1.0.0
    hooks:
      - id: "verify-consistent-pyproject-toml-python-requirements"

  - repo: "local"
    hooks:
      - id: "update-readme-pre-commit-example"
        name: "Update the README's pre-commit config example"
        language: "python"
        entry: "cog -rP README.rst"
        files: "pyproject\\.toml|assets/update_readme_pre_commit_example\\.py"
        pass_filenames: false
        additional_dependencies:
          - "cogapp==3.6.0"
