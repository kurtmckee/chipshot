encoding = "utf-8"


# Prologues
# ---------

[prologues.css-charset]
description = """
CSS supports a character set declaration at the top of the style sheet.
The `@charset <https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/At-rules/@charset>`__
rule must be the first line at the top of the file,
and this prologue will recognize and preserve this declaration.
"""
pattern = '^@charset: ".+";.*$'

[prologues.hashbang]
description = """
This is the standard hashbang that many shells rely on
to determine which executable to use to run a script.
"""
pattern = "^#!.+$"

[prologues.hashbang-with-encoding]
description = """
Some programming languages support hashbangs and optional encoding comments.
These encoding comments must be preserved at the top of the file.

These languages are known to support comments that declare the file encoding:

*   `Python <https://peps.python.org/pep-0263/>`__
*   `Ruby <https://docs.ruby-lang.org/en/master/syntax/comments_rdoc.html#label-Magic+Comments>`__
"""
# The following patterns match:
#   '#!hashbang'
#   '# encoding'
#   '#!hashbang' '\n' '# encoding'
# It also matches empty strings, which is undesirable.
pattern = "\\A(^#!.+$)?(?:(?(1)\\n|)^#.*(?:en)?coding[\\t ]*[:=].*$)?"

[prologues.html_doctype]
description = """
HTML DOCTYPE declarations help ensure that browsers render documents correctly.

Although it is documented that the DOCTYPE may be preceeded by comments,
Chipshot recognizes the DOCTYPE as a prologue and will preserve it
at the top of documents.
"""
pattern = "(?i)^<\\!doctype(.|\\n)+>$"

[prologues.xhtml_declaration_and_doctype]
description = """
This prologue is used to recognize XHTML documents,
which may require both an XML declaration as well as a DOCTYPE declaration.
"""
pattern = "^(<\\?xml(.|\\n)+\\?>)?\\s*(?i)(^<\\!doctype(.|\\n)+>)?$"

[prologues.xml_declaration]
description = """
Strict XML requires an XML declaration before any other content.

This prologue is used to recognize and preserve XML declarations
at the top of documents.
"""
pattern = "^<\\?xml(.|\\n)+\\?>$"


# Styles
# ------

[styles.apostrophe]
line_prefix = "' "

[styles.batch]
line_prefix = "rem "

[styles.dash-dash]
line_prefix = "-- "

[styles.hash]
line_prefix = "# "

[styles.html]
block_prefix = "<!--\n"
line_prefix = "    "
block_suffix = "\n-->"

[styles.jinja]
block_prefix = "{#\n"
block_suffix = "\n#}"

[styles.mustache]
block_prefix = "{{!\n"
block_suffix = "\n}}"

[styles.percent]
line_prefix = "% "

[styles.percent-percent]
line_prefix = "%% "

[styles.restructured-text]
block_prefix = "..\n"
line_prefix = "    "

[styles.semicolon]
line_prefix = "; "

[styles.slash-slash]
line_prefix = "// "

[styles.slash-star]
block_prefix = "/*\n"
line_prefix = " * "
block_suffix = "\n */"

[styles.xml]
block_prefix = "<!--\n"
line_prefix = "    "
block_suffix = "\n-->"


