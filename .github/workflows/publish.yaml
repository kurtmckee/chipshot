name: "📦 Publish"

on:
  push:
    branches:
      - "releases"

jobs:
  tag:
    name: "Tag"
    permissions:
      contents: "write"
    uses: "kurtmckee/github-workflows/.github/workflows/create-tag-and-release.yaml@d42d1e49ff61ab4c9e5114ec4bd05ef6b757621d" # v2.2

  build:
    name: "Build"
    needs:
      - "tag"
    permissions:
      contents: "read"
    uses: "kurtmckee/github-workflows/.github/workflows/build-python-package.yaml@d42d1e49ff61ab4c9e5114ec4bd05ef6b757621d" # v2.2

  publish:
    name: "Publish"
    needs:
      - "build"
    runs-on: "ubuntu-24.04"
    environment: "PyPI"
    permissions:
      id-token: "write"
    steps:
      - name: "Download the built packages"
        uses: "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333" # v8.0.2
        with:
          artifact-ids: "${{ needs.build.outputs.artifact-id }}"
          path: "${{ needs.build.outputs.packages-path }}"

      - name: "Publish package distributions to PyPI"
        uses: "pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33" # v1.14.2
        with:
          packages-dir: "${{ needs.build.outputs.packages-path }}"
