name: "✨ Prep release"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The new version"
        type: "string"
        required: true

jobs:
  prep_release:
    name: "Prep release v${{ inputs.version }}"

    permissions:
      contents: "write"
      pull-requests: "write"

    strategy:
      matrix:
        include:
          - tox-label-create-changes: "prep_release"
            branch-name: "release/$VERSION"
            commit-title: "Update project metadata"
            pr-base: "releases"
            pr-title: "Release v$VERSION"

    uses: "kurtmckee/github-workflows/.github/workflows/create-pr.yaml@d42d1e49ff61ab4c9e5114ec4bd05ef6b757621d" # v2.2
    with:
      config: "${{ toJSON(matrix) }}"
      version: "${{ inputs.version }}"
